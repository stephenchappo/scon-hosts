[Service]
# Wan MP4s must land INSIDE the art dropzone: Immich's ai-art external library
# only mounts the art dir into its container, so anything written to the sibling
# video/ dir is never indexed (and so never reaches the Animated album). Writing
# them into art/<date>/ alongside the PNGs puts them where both Immich and
# immich_sync.sidecar_index() already look. Quoted — the path contains a space.
Environment="GPUD_VIDEO_OUT_DIR=/marvin/Documents/AI Dropzone/art"
Environment="GPUD_COMFY_INPUT_DIR=/home/scon/ComfyUI/input"
