[Service]
# The 6656MB default assumes a COLD ComfyUI that must load the whole Wan graph,
# which needs ~7.2GB free — unreachable on an 8GB card while ComfyUI itself is
# up and idling (~700MB). ComfyUI is a persistent service here, so the figure
# that matters is the INCREMENTAL cost of one clip on top of an already-running
# backend: ~4.5GB of weights + latents. Without this, video jobs sat queued
# forever behind art/whisper while never clearing their own VRAM floor.
Environment="GPUD_VIDEO_VRAM_MB=4608"
