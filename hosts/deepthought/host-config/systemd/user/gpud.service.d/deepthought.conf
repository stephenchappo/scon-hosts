# Deepthought machine-specific config. Marvin is mounted at /marvin here (not
# /mnt/marvin), and Deepthought is not on the tailnet so gpud binds the LAN IP.
[Service]
Environment=GPUD_MARVIN_MOUNT_ROOT=/marvin
Environment="GPUD_DROPZONE_DIR=/marvin/Documents/AI Dropzone"
Environment=GPUD_PLEX_VIDEO_DIR=/marvin/Videos
Environment=GPUD_PHOTO_DIR=/marvin/Pictures/Photos
Environment=GPUD_BIND_HOST=192.168.42.150
