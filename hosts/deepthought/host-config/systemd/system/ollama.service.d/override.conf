[Service]
Environment="OLLAMA_HOST=0.0.0.0"
Environment="OLLAMA_KEEP_ALIVE=15m"
Environment="OLLAMA_NUM_PARALLEL=1"
# 2, not 1: lets a chat model and the embedding model co-reside, so Open WebUI
# memory/search/file-upload stop evicting whatever you are chatting with. Only
# safe with a chat model that leaves room — see docs/quant-bakeoff-2026-08-20.md
# in ~/projects/gpu-mode. big:latest (27B) leaves 44 MiB and CUDA-OOMs; qwen3.5:9b
# leaves 966 MiB and is fine.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
