# K/V context cache quantisation. Halves KV-cache VRAM vs the f16 default for a
# benchmarked perplexity cost of ~0.002-0.05. Requires OLLAMA_FLASH_ATTENTION=1
# (set in flash-attention.conf) - without it this is silently ignored.
# NOTE: also falls back to f16 silently on architectures that don't support it,
# so verify with a before/after VRAM measurement rather than assuming.
# Set 2026-08-27. Baseline before: chat:latest @32768 ctx = 5041 MiB (nvidia-smi).
[Service]
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
