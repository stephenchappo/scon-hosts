# Tailnet-only, so no accounts: who can reach it is decided by the tailnet policy
# (Stephen's devices and tag:server on 443). Same as Deepthought's server it replaces.
base-url: "https://eddie.batfish-pride.ts.net"
listen-http: ":80"
behind-proxy: true
cache-file: "/var/cache/ntfy/cache.db"
# 120 h so call-reminder's Mark as Done taps survive a four-day house outage until
# Trillian is back to read them.
cache-duration: "120h"
# Holds scheduled messages: scon-push's quiet-hours At: header (up to 12 hours) and
# `call-reminder handoff`, which hands a house outage's call reminders to eddie
# ahead of time (up to 5 days, the Nov 12-15 2026 outage).
delay-limit: "120h"
