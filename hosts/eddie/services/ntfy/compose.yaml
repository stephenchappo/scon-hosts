# ntfy on eddie: the phone's push server. Bound to localhost only; the tailnet reaches it
# through `tailscale serve` at https://eddie.batfish-pride.ts.net (see ../../install.sh).
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:8491:80"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ntfy-cache:/var/cache/ntfy
    environment:
      TZ: America/Los_Angeles
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  ntfy-cache:
