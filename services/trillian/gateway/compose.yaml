# The Trillian gateway. Go-live approved 2026-10-28; switched on by deploy.sh once the
# ~/.config/scon-gateway/LIVE marker exists; see README.md. Started by deploy.sh through bws-run, so the keys
# come from Secrets Manager at start time and never sit in a file.
name: scon-gateway
services:
  gateway:
    # deploy.sh builds and tags the image by the scon-hosts commit, then starts it with --no-build,
    # so a rollback runs the old code as well as the old tables.
    image: ${GATEWAY_IMAGE:?set by deploy.sh}
    restart: unless-stopped
    # Host network so both listeners bind Trillian's own loopback (127.0.0.1:8640 machine,
    # 127.0.0.1:8641 cloud) and nothing else, not even other containers, reaches them.
    # Ollama on Deepthought is reached over the tailnet (WireGuard), not the LAN.
    network_mode: host
    # Run as the deploying user so the bind-mounted state is writable (deploy.sh sets these).
    user: "${GATEWAY_UID:?set by deploy.sh}:${GATEWAY_GID:?set by deploy.sh}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GATEWAY_CONFIG: /config
      GATEWAY_STATE: /data/state
      GW_SHARED_LOG: /data/log/calls.jsonl
      GW_RESTRICTED_LOG: /restricted/log/calls.jsonl
      GW_CANARIES_FILE: /system/benchmark/canaries.json
      GW_OLLAMA_URL: http://100.78.161.123:11434
      GW_RELEASE: ${GATEWAY_RELEASE:?set by deploy.sh}
      GW_MACHINE_PORT: "8640"
      GW_CLOUD_PORT: "8641"
      GW_NTFY_URL: ${GW_NTFY_URL:-}
      # Cloudflare Access (INGRESS.md). Without both, the cloud listener refuses everything.
      GW_CF_TEAM_DOMAIN: ${GW_CF_TEAM_DOMAIN:-}
      GW_CF_AUD: ${GW_CF_AUD:-}
      # From Secrets Manager project "gateway". :? makes compose refuse to start without them.
      OPENROUTER_API: ${OPENROUTER_API:?run through bws-run gateway}
      # Token verifiers and tool credentials: compose.override.yaml, written by gen_override.py.
    volumes:
      - ${GATEWAY_SYSTEM_CHECKOUT:?set by deploy.sh}/gateway:/config:ro
      - ${GATEWAY_SYSTEM_CHECKOUT}/benchmark/canaries.json:/system/benchmark/canaries.json:ro
      - ${GATEWAY_DATA_DIR:?set by deploy.sh}:/data
      - ${GATEWAY_RESTRICTED_LOG_DIR:?set by deploy.sh}:/restricted/log
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8640/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file          # Alloy's docker source reads it into Loki ({container="scon-gateway-gateway-1"})
      options: {max-size: 10m, max-file: "3"}

  # The gateway's own Cloudflare Tunnel connector (INGRESS.md). Host network so it can reach the
  # cloud listener on Trillian's loopback (127.0.0.1:8641), which the shared cloudflared container
  # on the docker bridge cannot. Its tunnel has one public hostname, gw.<domain>, pointed at
  # http://127.0.0.1:8641 in the Cloudflare dashboard, behind an Access app that admits only
  # service tokens. The connector token comes from Secrets Manager project "gateway".
  tunnel:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:8642", "run"]
    environment:
      TUNNEL_TOKEN: ${GW_TUNNEL_TOKEN:?run through bws-run gateway}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
