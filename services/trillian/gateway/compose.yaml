# The Trillian gateway. STAGED: not deployed. It starts only after the D9 review and
# Scon's cards; see README.md. Started through bws-run so the keys come from Secrets
# Manager at start time and never sit in a file:
#   bws-run gateway -- docker compose up -d --build
name: scon-gateway
services:
  gateway:
    build: {context: ., target: service}
    image: scon-gateway:local
    restart: unless-stopped
    # Loopback only. Machines on the tailnet reach it through `tailscale serve`;
    # cloud sessions through the ingress in scon-system/gateway/INGRESS.md.
    ports: ["127.0.0.1:8640:8640"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      GATEWAY_CONFIG: /config
      GATEWAY_STATE: /data/state
      GW_SHARED_LOG: /data/log/calls.jsonl
      GW_RESTRICTED_LOG: /restricted/log/calls.jsonl
      GW_CANARIES_FILE: /system/benchmark/canaries.json
      GW_OLLAMA_URL: http://192.168.42.150:11434
      GW_NTFY_URL: ${GW_NTFY_URL:-}
      # From Secrets Manager project "gateway" (bws-run). :? makes compose refuse to start without them.
      OPENROUTER_API: ${OPENROUTER_API:?run through bws-run gateway}
      GW_ADMIN_SHA256: ${GW_ADMIN_SHA256:?run through bws-run gateway}
      # Token verifiers and tool credentials are passed by name; add one line per token or tool.
      # GW_TOKEN_SHA256_PERSONAL_SONNET: ${GW_TOKEN_SHA256_PERSONAL_SONNET:?}
    volumes:
      # The tables come from a checkout of scon-system pinned by deploy.sh, read-only.
      - ${GATEWAY_SYSTEM_CHECKOUT:?set by deploy.sh}/gateway:/config:ro
      - ${GATEWAY_SYSTEM_CHECKOUT}/benchmark/canaries.json:/system/benchmark/canaries.json:ro
      - ${HOME}/.local/state/scon-gateway:/data
      # Restricted full-text log; this path is inside the Restricted repo's clone on Trillian.
      - ${GATEWAY_RESTRICTED_LOG_DIR:?set by deploy.sh}:/restricted/log
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8640/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
